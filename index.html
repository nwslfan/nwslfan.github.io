            .pills-scroll::-webkit-scrollbar-thumb:hover { background: #ff3aa8; }

        .week-pill-active { background: #e91e8c; color: white; }
        .week-pill-inactive { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45); }
        .week-pill-inactive:hover { color: rgba(255,255,255,0.7); }
        .week-pill-current { box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
        select option { color: #111; background: #fff; }
        .week-pill-current-gold { box-shadow: 0 0 0 2px #f59e0b; }
        .today-dot { width: 6px; height: 6px; background: #e91e8c; border-radius: 50%; display: inline-block; margin-right: 4px; }
