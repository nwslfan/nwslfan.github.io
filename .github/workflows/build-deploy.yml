name: Build and Deploy

# Pages deploys from the main branch root (only the account owner can switch
# it to Actions deploys), so this builds index.html from src/index.html and
# commits it; the branch deploy then publishes it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'  # Daily 9am UTC — refresh results.json (scores + kickoff times)
  workflow_dispatch:

permissions:
  contents: write   # to commit refreshed results.json and built index.html

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh results.json
        run: node scripts/fetch-results.js

      - name: Install esbuild
        run: npm install esbuild --no-save --no-audit --no-fund

      - name: Build index.html
        run: node scripts/build.js

      - name: Commit results.json and index.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build index.html and update results.json [skip ci]"
            git push
          fi
